name: Track NSE Sectoral Indices

on:
  schedule:
    # 9:00, 9:15, ... 11:00 AM IST, Mon-Fri (times are in UTC; IST = UTC+5:30)
    - cron: '15,30,45 9 * * 1-5'
    - cron: '*/15 10 * * 1-5'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests

      - name: Reset log if it's a new day
        run: |
          python3 - <<'EOF'
          import os
          from datetime import date
          path = "sectoral_log.csv"
          today = date.today().isoformat()
          if os.path.exists(path):
              with open(path) as f:
                  lines = f.readlines()
              if len(lines) > 1 and not lines[-1].startswith(today):
                  with open(path, "w") as f:
                      f.write(lines[0])  # keep header only
          EOF

      - run: python nse_index_tracker.py --sectoral --log sectoral_log.csv

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sectoral_log.csv
          git commit -m "Update sectoral index log" || echo "No changes to commit"
          git push
